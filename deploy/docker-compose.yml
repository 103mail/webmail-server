# Two independent Domains on one machine, laid out the way the federation
# design describes: each Domain is its own Server (process + database) and
# serves its whole webmail surface under the single hostname
# `webmail.{domain}` (RFC 1.3 "Federation hostname", design 1).
#
# Per Domain:
#   api-*   the Go API server. Reachable only from inside its Domain network.
#           Its database is the SQLite file data/{domain}/webmail.db, which
#           setup.sh builds (ADR 19). Nothing is shared between Domains.
#   web-*   nginx. Serves the client bundle, /config.json and the peer
#           descriptor, terminates TLS, and proxies /api/v1/ to api-*. The
#           bundle and the API therefore share an origin, as design 2 requires.
#   ws-*    ws2api (profile `chat-ws`, off by default). See deploy/README.md.
#
# Networks:
#   dom-*        private per Domain. api is not reachable across it.
#   federation   the only shared network. Both web containers carry their real
#                federation hostname as an alias, so api-103mail resolves
#                webmail.example.com the way it would on the internet. Nothing
#                uses it yet; the backend has no federation endpoints.
#
# Host ports: each web container binds :443 on its own loopback address, so both
# Domains keep the RFC's URLs with no port suffix. Requires the /etc/hosts
# entries in deploy/README.md.

name: webmail

x-api: &api
  build:
    context: ..
    dockerfile: Dockerfile
  image: webmail-server:local
  restart: unless-stopped
  environment: &api-env
    WEBMAIL_ADDR: ":8080"
    WEBMAIL_DATA_DIR: /data
    # The API and the worker of a Domain share this file. SQLite runs in WAL
    # mode with a busy timeout, which is what makes that safe.
    WEBMAIL_DSN: sqlite:///data/webmail.db
    # No SNS or SES variables: outbound notifications are recorded in memory by
    # mailer.Recorder and the inbound webhook answers 503, so a local stack
    # cannot mail a real person.

x-web: &web
  build:
    context: ../../webmail-client
    dockerfile: Dockerfile
  image: webmail-client:local
  restart: unless-stopped

services:
  # ── 103mail.com ────────────────────────────────────────────────────────────
  api-103mail:
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.103mail.com
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
      WEBMAIL_WS_PUSH_URL: http://ws:7001
    volumes:
      - ./data/103mail.com:/data
      - ./domain/103mail.com/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-103mail:
        aliases: [api]
      federation:

  web-103mail:
    <<: *web
    environment:
      WEBMAIL_DOMAIN: 103mail.com
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/103mail.com:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
      federation:
        aliases: [webmail.103mail.com]

  # Deferred work for this Domain: draining the federation outbox and sweeping
  # what ages out with it. Separate from the API so a compose never waits on a
  # peer (ADR 17, principle 5).
  worker-103mail:
    <<: *api
    entrypoint: ["webmail-worker"]
    environment:
      <<: *api-env
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    volumes:
      - ./data/103mail.com:/data
      - ./domain/103mail.com/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    healthcheck:
      disable: true
    # The API creates the schema in an empty database file, so the worker
    # starts after it.
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
      federation:

  # Chat WebSockets terminate here, not in the API, so the API tier stays
  # stateless and a deploy does not drop every open socket (ADR 13, ADR 18).
  ws-103mail:
    build:
      context: ../../ws2api
      dockerfile: ../webmail-server/deploy/ws2api.Dockerfile
    image: ws2api:local
    restart: unless-stopped
    environment:
      WS2API_LISTEN: ":7001"
      WS2API_URL: http://api:8080/wsoverhttp/
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
        aliases: [ws]

  # ── example.com ────────────────────────────────────────────────────────────
  api-example:
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.example.com
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
      WEBMAIL_WS_PUSH_URL: http://ws:7001
    volumes:
      - ./data/example.com:/data
      - ./domain/example.com/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-example:
        aliases: [api]
      federation:

  web-example:
    <<: *web
    environment:
      WEBMAIL_DOMAIN: example.com
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/example.com:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.2:443:443"
      - "127.0.0.2:80:80"
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
      federation:
        aliases: [webmail.example.com]

  # Deferred work for this Domain: draining the federation outbox and sweeping
  # what ages out with it. Separate from the API so a compose never waits on a
  # peer (ADR 17, principle 5).
  worker-example:
    <<: *api
    entrypoint: ["webmail-worker"]
    environment:
      <<: *api-env
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    volumes:
      - ./data/example.com:/data
      - ./domain/example.com/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    healthcheck:
      disable: true
    # The API creates the schema in an empty database file, so the worker
    # starts after it.
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
      federation:

  # Chat WebSockets terminate here, not in the API, so the API tier stays
  # stateless and a deploy does not drop every open socket (ADR 13, ADR 18).
  ws-example:
    build:
      context: ../../ws2api
      dockerfile: ../webmail-server/deploy/ws2api.Dockerfile
    image: ws2api:local
    restart: unless-stopped
    environment:
      WS2API_LISTEN: ":7001"
      WS2API_URL: http://api:8080/wsoverhttp/
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
        aliases: [ws]

networks:
  dom-103mail:
    internal: true
  dom-example:
    internal: true
  federation:

