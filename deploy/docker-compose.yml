# Four independent Domains on one machine, laid out the way the federation
# design describes: each Domain is its own Server (process + database) and
# serves its whole webmail surface under the single hostname
# `webmail.{domain}` (RFC 1.3 "Federation hostname", design 1).
#
# Per Domain:
#   api-*   the Go API server. Reachable only from inside its Domain network.
#           Its database is the SQLite file data/{domain}/webmail.db, which
#           setup.sh builds (ADR 19). Nothing is shared between Domains.
#   web-*   nginx. Serves the client bundle, /config.json and the peer
#           descriptor, terminates TLS, and proxies /api/v1/ to api-*. The
#           bundle and the API therefore share an origin, as design 2 requires.
#   ws-*    ws2api (profile `chat-ws`, off by default). See deploy/README.md.
#           mail.acme.test and acme.test have none: chat does not federate,
#           and those Domains exist for the end-to-end stories, which do not
#           use it.
#
# Networks:
#   dom-*        private per Domain. api is not reachable across it.
#   federation   the only shared network. Every web container carries its real
#                federation hostname as an alias, so api-103mail resolves
#                webmail.example.com the way it would on the internet. Federated
#                envelopes travel over it.
#
# Host ports: each web container binds :443 on its own loopback address, so
# every Domain keeps the RFC's URLs with no port suffix. Requires the /etc/hosts
# entries in deploy/README.md.

name: webmail

x-api: &api
  build:
    context: ..
    dockerfile: Dockerfile
  image: webmail-server:local
  restart: unless-stopped
  environment: &api-env
    WEBMAIL_ADDR: ":8080"
    WEBMAIL_DATA_DIR: /data
    # The API and the worker of a Domain share this file. SQLite runs in WAL
    # mode with a busy timeout, which is what makes that safe.
    WEBMAIL_DSN: sqlite:///data/webmail.db
    # Outbound notifications are published to SNS as in production, but the
    # SDK is pointed at the mail sink, which captures them instead of
    # delivering them. The credentials are placeholders the sink ignores. No
    # SES variables, so the inbound webhook answers 503. Either way a local
    # stack cannot mail a real person.
    AWS_ENDPOINT_URL_SNS: http://mailsink:4566
    AWS_ACCESS_KEY_ID: mailsink
    AWS_SECRET_ACCESS_KEY: mailsink
    AWS_EC2_METADATA_DISABLED: "true"
    WEBMAIL_SNS_REGION: eu-west-1

x-web: &web
  build:
    context: ../../webmail-client
    dockerfile: Dockerfile
  image: webmail-client:local
  restart: unless-stopped

services:
  # ── 103mail.com ────────────────────────────────────────────────────────────
  api-103mail:
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.103mail.com
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:103mail-com
      WEBMAIL_CONTROL_ADDR: ":8081"
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
      WEBMAIL_WS_PUSH_URL: http://ws:7001
    # The read-only end-to-end test controls (ADR 20), on this Domain's own
    # loopback address like its web container.
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data/103mail.com:/data
      - ./domain/103mail.com/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-103mail:
        aliases: [api]
      federation:

  web-103mail:
    <<: *web
    environment:
      WEBMAIL_DOMAIN: 103mail.com
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/103mail.com:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
      federation:
        aliases: [webmail.103mail.com]

  # Deferred work for this Domain: draining the federation outbox and sweeping
  # what ages out with it. Separate from the API so a compose never waits on a
  # peer (ADR 17, principle 5).
  worker-103mail:
    <<: *api
    entrypoint: ["webmail-worker"]
    environment:
      <<: *api-env
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    volumes:
      - ./data/103mail.com:/data
      - ./domain/103mail.com/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    healthcheck:
      disable: true
    # The API creates the schema in an empty database file, so the worker
    # starts after it.
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
      federation:

  # Chat WebSockets terminate here, not in the API, so the API tier stays
  # stateless and a deploy does not drop every open socket (ADR 13, ADR 18).
  ws-103mail:
    build:
      context: ../../ws2api
      dockerfile: ../webmail-server/deploy/ws2api.Dockerfile
    image: ws2api:local
    restart: unless-stopped
    environment:
      WS2API_LISTEN: ":7001"
      WS2API_URL: http://api:8080/wsoverhttp/
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
        aliases: [ws]

  # ── example.com ────────────────────────────────────────────────────────────
  api-example:
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.example.com
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:example-com
      WEBMAIL_CONTROL_ADDR: ":8081"
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
      WEBMAIL_WS_PUSH_URL: http://ws:7001
    # The read-only end-to-end test controls (ADR 20), on this Domain's own
    # loopback address like its web container.
    ports:
      - "127.0.0.2:8081:8081"
    volumes:
      - ./data/example.com:/data
      - ./domain/example.com/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-example:
        aliases: [api]
      federation:

  web-example:
    <<: *web
    environment:
      WEBMAIL_DOMAIN: example.com
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/example.com:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.2:443:443"
      - "127.0.0.2:80:80"
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
      federation:
        aliases: [webmail.example.com]

  # Deferred work for this Domain: draining the federation outbox and sweeping
  # what ages out with it. Separate from the API so a compose never waits on a
  # peer (ADR 17, principle 5).
  worker-example:
    <<: *api
    entrypoint: ["webmail-worker"]
    environment:
      <<: *api-env
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    volumes:
      - ./data/example.com:/data
      - ./domain/example.com/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    healthcheck:
      disable: true
    # The API creates the schema in an empty database file, so the worker
    # starts after it.
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
      federation:

  # Chat WebSockets terminate here, not in the API, so the API tier stays
  # stateless and a deploy does not drop every open socket (ADR 13, ADR 18).
  ws-example:
    build:
      context: ../../ws2api
      dockerfile: ../webmail-server/deploy/ws2api.Dockerfile
    image: ws2api:local
    restart: unless-stopped
    environment:
      WS2API_LISTEN: ":7001"
      WS2API_URL: http://api:8080/wsoverhttp/
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
        aliases: [ws]

  # ── mail.acme.test ─────────────────────────────────────────────────────────
  # A Domain on a subdomain (RFC 4.1.1). It is not acme.test and shares
  # nothing with it: its own key, its own database, its own hostname.
  api-acme:
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.mail.acme.test
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:mail-acme-test
      WEBMAIL_CONTROL_ADDR: ":8081"
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    # The read-only end-to-end test controls (ADR 20), on this Domain's own
    # loopback address like its web container.
    ports:
      - "127.0.0.3:8081:8081"
    volumes:
      - ./data/mail.acme.test:/data
      - ./domain/mail.acme.test/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-acme:
        aliases: [api]
      federation:

  web-acme:
    <<: *web
    environment:
      WEBMAIL_DOMAIN: mail.acme.test
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/mail.acme.test:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.3:443:443"
      - "127.0.0.3:80:80"
    depends_on:
      api-acme:
        condition: service_healthy
    networks:
      dom-acme:
      federation:
        aliases: [webmail.mail.acme.test]

  worker-acme:
    <<: *api
    entrypoint: ["webmail-worker"]
    environment:
      <<: *api-env
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    volumes:
      - ./data/mail.acme.test:/data
      - ./domain/mail.acme.test/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    healthcheck:
      disable: true
    depends_on:
      api-acme:
        condition: service_healthy
    networks:
      dom-acme:
      federation:

  # ── acme.test ──────────────────────────────────────────────────────────────
  # The parent domain of mail.acme.test, and a separate Domain: its own key,
  # database and hostname. A parent and its subdomain share nothing on the
  # wire (RFC 4.1.1). The services are called "parent" because "acme" is
  # mail.acme.test.
  api-parent:
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.acme.test
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:acme-test
      WEBMAIL_CONTROL_ADDR: ":8081"
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    # The read-only end-to-end test controls (ADR 20), on this Domain's own
    # loopback address like its web container.
    ports:
      - "127.0.0.4:8081:8081"
    volumes:
      - ./data/acme.test:/data
      - ./domain/acme.test/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-parent:
        aliases: [api]
      federation:

  web-parent:
    <<: *web
    environment:
      WEBMAIL_DOMAIN: acme.test
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/acme.test:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.4:443:443"
      - "127.0.0.4:80:80"
    depends_on:
      api-parent:
        condition: service_healthy
    networks:
      dom-parent:
      federation:
        aliases: [webmail.acme.test]

  worker-parent:
    <<: *api
    entrypoint: ["webmail-worker"]
    environment:
      <<: *api-env
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    volumes:
      - ./data/acme.test:/data
      - ./domain/acme.test/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./certs:/etc/webmail/certs:ro
    healthcheck:
      disable: true
    depends_on:
      api-parent:
        condition: service_healthy
    networks:
      dom-parent:
      federation:

  # ── Shared ─────────────────────────────────────────────────────────────────
  # Stands in for SNS for every Domain, so notification email is captured
  # rather than sent. The end-to-end stories read it at
  # http://127.0.0.1:8025/messages to find invitations and to prove that no
  # message content left any Domain by email.
  mailsink:
    build:
      context: ..
      dockerfile: deploy/mailsink.Dockerfile
    image: webmail-mailsink:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:4566"
    networks:
      federation:
        aliases: [mailsink]

networks:
  dom-103mail:
    internal: true
  dom-example:
    internal: true
  dom-acme:
    internal: true
  dom-parent:
    internal: true
  federation:

