# Four independent Domains on one machine, and the scripted peer.test, laid out the way the federation
# design describes: each Domain is its own Server (process + database) and
# serves its whole webmail surface under the single hostname
# `webmail.{domain}` (RFC 1.3 "Federation hostname", design 1).
#
# Per Domain:
#   api-*   the Go API server. Reachable only from inside its Domain network.
#           Its database is the SQLite file data/{domain}/webmail.db, which
#           setup.sh builds (ADR 19). Nothing is shared between Domains.
#   web-*   nginx. Serves the client bundle, /config.json and the peer
#           descriptor, terminates TLS, and proxies /api/v1/ to api-*. The
#           bundle and the API therefore share an origin, as design 2 requires.
#   ws-*    ws2api (profile `chat-ws`, off by default). See deploy/README.md.
#           mail.acme.test and acme.test have none: chat does not federate,
#           and those Domains exist for the end-to-end stories, which do not
#           use it.
#
# Networks:
#   dom-*        private per Domain. api is not reachable across it.
#   federation   the only shared network. Every web container carries its real
#                federation hostname as an alias, so api-103mail resolves
#                webmail.example.com the way it would on the internet. Federated
#                envelopes travel over it.
#
# Host ports: each web container binds :443 on its own loopback address, so
# every Domain keeps the RFC's URLs with no port suffix. Requires the /etc/hosts
# entries in deploy/README.md.

name: webmail

x-api: &api
  build:
    context: ..
    dockerfile: Dockerfile
  image: webmail-server:local
  restart: unless-stopped
  environment: &api-env
    WEBMAIL_ADDR: ":8080"
    WEBMAIL_DATA_DIR: /data
    # The API and the worker of a Domain share this file. SQLite runs in WAL
    # mode with a busy timeout, which is what makes that safe.
    WEBMAIL_DSN: sqlite:///data/webmail.db
    # One clock offset for every Domain, which the end-to-end suite moves
    # forward to let time pass without waiting (store.OffsetClock). Shared, so
    # every Domain's timestamps stay comparable. Test stacks only.
    WEBMAIL_CLOCK_FILE: /etc/webmail/clock/offset
    # Outbound notifications are published to SNS as in production, but the
    # SDK is pointed at the mail sink, which captures them instead of
    # delivering them. The credentials are placeholders the sink ignores. No
    # SES variables, so the inbound webhook answers 503. Either way a local
    # stack cannot mail a real person.
    AWS_ENDPOINT_URL_SNS: http://mailsink:4566
    AWS_ACCESS_KEY_ID: mailsink
    AWS_SECRET_ACCESS_KEY: mailsink
    AWS_EC2_METADATA_DISABLED: "true"
    WEBMAIL_SNS_REGION: eu-west-1
    # Room for a 25 MiB attachment in base64, the RFC's default cap, with the
    # nginx client_max_body_size to match.
    WEBMAIL_MAX_BODY_BYTES: "50331648"

x-web: &web
  build:
    context: ../../webmail-client
    dockerfile: Dockerfile
  image: webmail-client:local
  restart: unless-stopped

services:
  # ── 103mail.com ────────────────────────────────────────────────────────────
  api-103mail:
    labels:
      webmail.domain: 103mail.com
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.103mail.com
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:103mail-com
      WEBMAIL_CONTROL_ADDR: ":8081"
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
      WEBMAIL_WS_PUSH_URL: http://ws:7001
    # The read-only end-to-end test controls (ADR 20), on this Domain's own
    # loopback address like its web container.
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data/103mail.com:/data
      - ${FEDERATION_CONFIG_103MAIL_COM:-./domain/103mail.com/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-103mail:
        aliases: [api]
      federation:

  web-103mail:
    labels:
      webmail.domain: 103mail.com
    <<: *web
    environment:
      WEBMAIL_DOMAIN: 103mail.com
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/103mail.com:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
      federation:
        aliases: [webmail.103mail.com]

  # Deferred work for this Domain: draining the federation outbox and sweeping
  # what ages out with it. Separate from the API so a compose never waits on a
  # peer (ADR 17, principle 5).
  worker-103mail:
    labels:
      webmail.domain: 103mail.com
    <<: *api
    entrypoint: ["webmail-worker"]
    environment:
      <<: *api-env
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
      # The RFC's 72 hours unless a story shortens it (deploy/README.md).
      WEBMAIL_RETRY_BUDGET: ${RETRY_BUDGET_103MAIL_COM:-72h}
      WEBMAIL_BACKFILL_PROBE: 10s
      WEBMAIL_WORKER_INTERVAL_SECONDS: "1"
    volumes:
      - ./data/103mail.com:/data
      - ${FEDERATION_CONFIG_103MAIL_COM:-./domain/103mail.com/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    healthcheck:
      disable: true
    # The API creates the schema in an empty database file, so the worker
    # starts after it.
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
      federation:

  # Chat WebSockets terminate here, not in the API, so the API tier stays
  # stateless and a deploy does not drop every open socket (ADR 13, ADR 18).
  ws-103mail:
    labels:
      webmail.domain: 103mail.com
    build:
      context: ../../ws2api
      dockerfile: ../webmail-server/deploy/ws2api.Dockerfile
    image: ws2api:local
    restart: unless-stopped
    environment:
      WS2API_LISTEN: ":7001"
      WS2API_URL: http://api:8080/wsoverhttp/
    depends_on:
      api-103mail:
        condition: service_healthy
    networks:
      dom-103mail:
        aliases: [ws]

  # ── example.com ────────────────────────────────────────────────────────────
  api-example:
    labels:
      webmail.domain: example.com
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.example.com
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:example-com
      WEBMAIL_CONTROL_ADDR: ":8081"
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
      WEBMAIL_WS_PUSH_URL: http://ws:7001
    # The read-only end-to-end test controls (ADR 20), on this Domain's own
    # loopback address like its web container.
    ports:
      - "127.0.0.2:8081:8081"
    volumes:
      - ./data/example.com:/data
      - ${FEDERATION_CONFIG_EXAMPLE_COM:-./domain/example.com/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-example:
        aliases: [api]
      federation:

  web-example:
    labels:
      webmail.domain: example.com
    <<: *web
    environment:
      WEBMAIL_DOMAIN: example.com
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/example.com:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.2:443:443"
      - "127.0.0.2:80:80"
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
      federation:
        aliases: [webmail.example.com]

  # Deferred work for this Domain: draining the federation outbox and sweeping
  # what ages out with it. Separate from the API so a compose never waits on a
  # peer (ADR 17, principle 5).
  worker-example:
    labels:
      webmail.domain: example.com
    <<: *api
    entrypoint: ["webmail-worker"]
    environment:
      <<: *api-env
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
      # The RFC's 72 hours unless a story shortens it (deploy/README.md).
      WEBMAIL_RETRY_BUDGET: ${RETRY_BUDGET_EXAMPLE_COM:-72h}
      WEBMAIL_BACKFILL_PROBE: 10s
      WEBMAIL_WORKER_INTERVAL_SECONDS: "1"
    volumes:
      - ./data/example.com:/data
      - ${FEDERATION_CONFIG_EXAMPLE_COM:-./domain/example.com/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    healthcheck:
      disable: true
    # The API creates the schema in an empty database file, so the worker
    # starts after it.
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
      federation:

  # Chat WebSockets terminate here, not in the API, so the API tier stays
  # stateless and a deploy does not drop every open socket (ADR 13, ADR 18).
  ws-example:
    labels:
      webmail.domain: example.com
    build:
      context: ../../ws2api
      dockerfile: ../webmail-server/deploy/ws2api.Dockerfile
    image: ws2api:local
    restart: unless-stopped
    environment:
      WS2API_LISTEN: ":7001"
      WS2API_URL: http://api:8080/wsoverhttp/
    depends_on:
      api-example:
        condition: service_healthy
    networks:
      dom-example:
        aliases: [ws]

  # ── mail.acme.test ─────────────────────────────────────────────────────────
  # A Domain on a subdomain (RFC 4.1.1). It is not acme.test and shares
  # nothing with it: its own key, its own database, its own hostname.
  api-acme:
    labels:
      webmail.domain: mail.acme.test
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.mail.acme.test
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:mail-acme-test
      WEBMAIL_CONTROL_ADDR: ":8081"
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    # The read-only end-to-end test controls (ADR 20), on this Domain's own
    # loopback address like its web container.
    ports:
      - "127.0.0.3:8081:8081"
    volumes:
      - ./data/mail.acme.test:/data
      - ${FEDERATION_CONFIG_MAIL_ACME_TEST:-./domain/mail.acme.test/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-acme:
        aliases: [api]
      federation:

  web-acme:
    labels:
      webmail.domain: mail.acme.test
    <<: *web
    environment:
      WEBMAIL_DOMAIN: mail.acme.test
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/mail.acme.test:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.3:443:443"
      - "127.0.0.3:80:80"
    depends_on:
      api-acme:
        condition: service_healthy
    networks:
      dom-acme:
      federation:
        aliases: [webmail.mail.acme.test]

  worker-acme:
    labels:
      webmail.domain: mail.acme.test
    <<: *api
    entrypoint: ["webmail-worker"]
    environment:
      <<: *api-env
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
      # The RFC's 72 hours unless a story shortens it (deploy/README.md).
      WEBMAIL_RETRY_BUDGET: ${RETRY_BUDGET_MAIL_ACME_TEST:-72h}
      WEBMAIL_BACKFILL_PROBE: 10s
      WEBMAIL_WORKER_INTERVAL_SECONDS: "1"
    volumes:
      - ./data/mail.acme.test:/data
      - ${FEDERATION_CONFIG_MAIL_ACME_TEST:-./domain/mail.acme.test/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    healthcheck:
      disable: true
    depends_on:
      api-acme:
        condition: service_healthy
    networks:
      dom-acme:
      federation:

  # ── acme.test ──────────────────────────────────────────────────────────────
  # The parent domain of mail.acme.test, and a separate Domain: its own key,
  # database and hostname. A parent and its subdomain share nothing on the
  # wire (RFC 4.1.1). The services are called "parent" because "acme" is
  # mail.acme.test.
  api-parent:
    labels:
      webmail.domain: acme.test
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.acme.test
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:acme-test
      WEBMAIL_CONTROL_ADDR: ":8081"
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    # The read-only end-to-end test controls (ADR 20), on this Domain's own
    # loopback address like its web container.
    ports:
      - "127.0.0.4:8081:8081"
    volumes:
      - ./data/acme.test:/data
      - ${FEDERATION_CONFIG_ACME_TEST:-./domain/acme.test/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-parent:
        aliases: [api]
      federation:

  web-parent:
    labels:
      webmail.domain: acme.test
    <<: *web
    environment:
      WEBMAIL_DOMAIN: acme.test
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/acme.test:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.4:443:443"
      - "127.0.0.4:80:80"
    depends_on:
      api-parent:
        condition: service_healthy
    networks:
      dom-parent:
      federation:
        aliases: [webmail.acme.test]

  worker-parent:
    labels:
      webmail.domain: acme.test
    <<: *api
    entrypoint: ["webmail-worker"]
    environment:
      <<: *api-env
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
      # The RFC's 72 hours unless a story shortens it (deploy/README.md).
      WEBMAIL_RETRY_BUDGET: ${RETRY_BUDGET_ACME_TEST:-72h}
      WEBMAIL_BACKFILL_PROBE: 10s
      WEBMAIL_WORKER_INTERVAL_SECONDS: "1"
    volumes:
      - ./data/acme.test:/data
      - ${FEDERATION_CONFIG_ACME_TEST:-./domain/acme.test/federation.json}:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    healthcheck:
      disable: true
    depends_on:
      api-parent:
        condition: service_healthy
    networks:
      dom-parent:
      federation:

  # ── peer.test ──────────────────────────────────────────────────────────────
  # The scripted peer of the end-to-end stories. It is a Domain like the
  # others, so it publishes a real descriptor from its own key, but nobody
  # uses it: the stories sign envelopes with keys/peer.test.ed25519.pem and
  # send forged, replayed and malformed traffic as it. No worker, because it
  # never sends anything itself, and no host ports, because only the other
  # Domains need to reach it.
  api-peer:
    labels:
      webmail.domain: peer.test
    <<: *api
    environment:
      <<: *api-env
      WEBMAIL_ALLOWED_ORIGINS: https://webmail.peer.test
      WEBMAIL_SNS_TOPIC_ARN: arn:aws:sns:eu-west-1:000000000000:peer-test
      WEBMAIL_FEDERATION_CONFIG: /etc/webmail/federation.json
    volumes:
      - ./data/peer.test:/data
      - ./domain/peer.test/federation.json:/etc/webmail/federation.json:ro
      - ./keys:/etc/webmail/keys:ro
      - ./clock:/etc/webmail/clock:ro
      - ./certs:/etc/webmail/certs:ro
    networks:
      dom-peer:
        aliases: [api]
      federation:

  web-peer:
    labels:
      webmail.domain: peer.test
    <<: *web
    environment:
      WEBMAIL_DOMAIN: peer.test
    volumes:
      - ./nginx/webmail.conf.template:/etc/nginx/templates/webmail.conf.template:ro
      - ./domain/peer.test:/etc/nginx/domain:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api-peer:
        condition: service_healthy
    networks:
      dom-peer:
      federation:
        aliases: [webmail.peer.test]

  # ── Shared ─────────────────────────────────────────────────────────────────
  # Every Domain's federation inbound endpoint goes through here, and is
  # passed to that Domain's API unchanged unless a story arms a fault: a lost
  # answer, or a refusal the API did not give. Its controls are at
  # http://127.0.0.1:8026/faults (deploy/faults).
  faults:
    build:
      context: ..
      dockerfile: deploy/faults.Dockerfile
    image: webmail-faults:local
    restart: unless-stopped
    environment:
      FAULTS_UPSTREAMS: >-
        103mail.com=api-103mail:8080,example.com=api-example:8080,mail.acme.test=api-acme:8080,acme.test=api-parent:8080,peer.test=api-peer:8080
    ports:
      - "127.0.0.1:8026:8026"
    networks:
      federation:
        aliases: [faults]


  # Stands in for SNS for every Domain, so notification email is captured
  # rather than sent. The end-to-end stories read it at
  # http://127.0.0.1:8025/messages to find invitations and to prove that no
  # message content left any Domain by email.
  mailsink:
    build:
      context: ..
      dockerfile: deploy/mailsink.Dockerfile
    image: webmail-mailsink:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:4566"
    networks:
      federation:
        aliases: [mailsink]

networks:
  dom-103mail:
    internal: true
  dom-example:
    internal: true
  dom-acme:
    internal: true
  dom-parent:
    internal: true
  dom-peer:
    internal: true
  federation:

